[package]
name = "hd60s-control"
version = "0.1.0"
edition = "2024"
description = "Control program for the Elgato HD60 S service (hd60s-linux serve)"
license = "MIT"
repository = "https://github.com/Hydrogen2K/hd60s-linux"

[dependencies]
libc = "0.2"
serde_json = "1"
slint = { version = "1.17", features = ["unstable-winit-030"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[build-dependencies]
slint-build = "1.17"
